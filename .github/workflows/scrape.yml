name: Registrar pronosticos

on:
  # 12 corridas diarias (~cada 2hs), incluyendo EXACTOS tus 4 horarios
  # originales: 21hs/4hs/10hs/17hs Argentina = 0/7/13/20 UTC
  schedule:
    - cron: "0 0,2,4,6,7,9,11,13,15,17,20,22 * * *"
  # Permite dispararlo a mano desde la pestaña "Actions" para probar
  workflow_dispatch: {}

jobs:
  registrar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr el script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
        run: python scrape.py

      - name: Commitear el CSV actualizado
        run: |
          git config user.name "temp-tracker-bot"
          git config user.email "actions@github.com"
          git add data/temperaturas.csv
          git diff --cached --quiet || git commit -m "Registro automatico $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

name: Registrar pronosticos

on:
  # 4 horarios diarios, bien separados entre si (mínimo 5hs de diferencia)
  # para reducir al maximo la chance de que GitHub Actions salte una
  # corrida por colision/congestion con otra cercana.
  # 1am / 8am / 15hs / 20hs hora Argentina = 4/11/18/23 UTC
  schedule:
    - cron: "7 4 * * *"
    - cron: "7 11 * * *"
    - cron: "7 18 * * *"
    - cron: "7 23 * * *"
  # Permite dispararlo a mano desde la pestaña "Actions" para probar
  workflow_dispatch:
    inputs:
      forzar_telegram:
        description: "Mandar Telegram aunque no sea horario de aviso (para probar)"
        required: false
        default: true
        type: boolean

jobs:
  registrar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr el script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
          FORZAR_TELEGRAM: ${{ github.event.inputs.forzar_telegram }}
          CRON_PROGRAMADO: ${{ github.event.schedule }}
        run: python scrape.py

      - name: Commitear el CSV actualizado
        run: |
          git config user.name "temp-tracker-bot"
          git config user.email "actions@github.com"
          git add data/temperaturas.csv
          git diff --cached --quiet || git commit -m "Registro automatico $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

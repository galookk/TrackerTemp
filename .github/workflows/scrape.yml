name: Registrar pronosticos

on:
  # SIN "schedule:" a proposito. El disparo automatico ahora lo hace un
  # servicio externo (cron-job.org) llamando a la API de GitHub para
  # activar este mismo workflow_dispatch a la hora exacta -- mucho mas
  # confiable que el cron interno de GitHub Actions, que demostro
  # saltear corridas seguido bajo carga.
  workflow_dispatch:
    inputs:
      forzar_telegram:
        description: "Mandar Telegram aunque no sea horario de aviso (para probar)"
        required: false
        default: true
        type: boolean

jobs:
  registrar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr el script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
          FORZAR_TELEGRAM: ${{ github.event.inputs.forzar_telegram }}
          CRON_PROGRAMADO: ${{ github.event.schedule }}
        run: python scrape.py

      - name: Commitear el CSV actualizado
        run: |
          git config user.name "temp-tracker-bot"
          git config user.email "actions@github.com"
          git add data/temperaturas.csv
          git diff --cached --quiet || git commit -m "Registro automatico $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

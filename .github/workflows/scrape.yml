name: Registrar pronosticos

on:
  # 15 horarios programados, cada uno como cron SEPARADO (en vez de uno
  # combinado). Esto permite que el script sepa "que horario tenia que
  # ser esta corrida" via github.event.schedule, sin importar si GitHub
  # la arranca tarde por congestion (algo que pasa seguido).
  # Ademas corren en el minuto :07 en vez de en punto -- el "en punto" de
  # cada hora es el momento de mas carga en GitHub Actions a nivel global,
  # asi que correr un poco desfasado reduce la chance de demora.
  schedule:
    - cron: "7 0 * * *"
    - cron: "7 2 * * *"
    - cron: "7 4 * * *"
    - cron: "7 6 * * *"
    - cron: "7 7 * * *"
    - cron: "7 9 * * *"
    - cron: "7 11 * * *"
    - cron: "7 13 * * *"
    - cron: "7 14 * * *"
    - cron: "7 15 * * *"
    - cron: "7 17 * * *"
    - cron: "7 18 * * *"
    - cron: "7 20 * * *"
    - cron: "7 22 * * *"
    - cron: "7 23 * * *"
  # Permite dispararlo a mano desde la pestaña "Actions" para probar
  workflow_dispatch:
    inputs:
      forzar_telegram:
        description: "Mandar Telegram aunque no sea horario de aviso (para probar)"
        required: false
        default: true
        type: boolean

jobs:
  registrar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr el script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
          FORZAR_TELEGRAM: ${{ github.event.inputs.forzar_telegram }}
          CRON_PROGRAMADO: ${{ github.event.schedule }}
        run: python scrape.py

      - name: Commitear el CSV actualizado
        run: |
          git config user.name "temp-tracker-bot"
          git config user.email "actions@github.com"
          git add data/temperaturas.csv
          git diff --cached --quiet || git commit -m "Registro automatico $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push


          .

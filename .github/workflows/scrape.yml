name: Registrar pronosticos

on:
  # 15 corridas diarias. Incluye EXACTOS:
  #  - Tus 4 horarios de aviso por Telegram: 21/4/10/17hs ART = 0/7/13/20 UTC
  #  - Tus 5 checkpoints para la herramienta local: 6/11/15/20/1hs ART = 9/14/18/23/4 UTC
  #  - Mas algunos horarios intermedios para mantener ~cada 2hs de cobertura general
  schedule:
    - cron: "0 0,2,4,6,7,9,11,13,14,15,17,18,20,22,23 * * *"
  # Permite dispararlo a mano desde la pestaña "Actions" para probar
  workflow_dispatch: {}

jobs:
  registrar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr el script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
        run: python scrape.py

      - name: Commitear el CSV actualizado
        run: |
          git config user.name "temp-tracker-bot"
          git config user.email "actions@github.com"
          git add data/temperaturas.csv
          git diff --cached --quiet || git commit -m "Registro automatico $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
